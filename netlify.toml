[build]
	command = "npm run build"
	publish = "dist"

[build.environment]
	NODE_VERSION = "22"

# Rendered pages are CDN-cached by the base layer (durable, kit.cacheMaxAge).
# With no CMS there is nothing to purge by tag: content is in the code, and a
# deploy clears the cache.

# Keep this until the real domain goes live, then remove it and set
# NUXT_PUBLIC_INDEXABLE=true. Rendered pages already send X-Robots-Tag; this
# covers files the CDN serves straight off disk, which never reach the server.
[[headers]]
	for = "/*"
	[headers.values]
		X-Robots-Tag = "noindex, nofollow"

# Hashed build output never changes under its name.
[[headers]]
	for = "/_nuxt/*"
	[headers.values]
		Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
	for = "/llms.txt"
	[headers.values]
		Content-Type = "text/plain; charset=utf-8"
